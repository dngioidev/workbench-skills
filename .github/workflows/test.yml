name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bash:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Bash installer tests
        shell: bash
        run: bash tests/test-install.sh

  powershell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 installer tests
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/test-install.ps1
      - name: PowerShell 7 installer tests
        shell: pwsh
        run: ./tests/test-install.ps1

  hooks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skill hook tests
        run: node tests/test-hooks.js

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Manifests are valid JSON
        run: jq empty .claude-plugin/marketplace.json .claude-plugin/plugin.json
